<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaDo QR Pro | Google Review Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-field { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 12px; width: 100%; color: white; outline: none; font-size: 13px; }
        .active-tab { background: linear-gradient(135deg, #3b82f6, #6366f1) !important; color: white !important; }
        .iphone-frame { width: 270px; height: 540px; border: 10px solid #1e293b; border-radius: 40px; position: relative; overflow: hidden; background: #0f172a; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .iphone-notch { width: 110px; height: 20px; background: #1e293b; position: absolute; top: 0; left: 50%; transform: translateX(-50%); border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 10; }
        .preset-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        .preset-btn { aspect-ratio: 1/1; padding: 6px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .preset-btn img { width: 100%; height: 100%; object-fit: contain; }
        .selected-preset { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.2) !important; }
    </style>
</head>
<body class="p-4">

<div id="creator-ui" class="max-w-7xl mx-auto">
    <header class="text-center mb-8">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 italic">MaDo QR Pro</h1>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-4 space-y-4">
            <div class="glass p-5 rounded-[2rem]">
                <div class="flex p-1 bg-black/40 rounded-xl gap-1 mb-4 overflow-x-auto">
                    <button onclick="switchTab('url')" id="tab-url" class="tab-btn flex-1 py-2 px-3 rounded-lg text-[10px] font-bold transition">رابط</button>
                    <button onclick="switchTab('google_review')" id="tab-google_review" class="tab-btn flex-1 py-2 px-3 rounded-lg text-[10px] font-bold transition text-blue-400"><i class="fa-solid fa-star ml-1"></i>تقييم</button>
                    <button onclick="switchTab('social')" id="tab-social" class="tab-btn flex-1 py-2 px-3 rounded-lg text-[10px] font-bold transition">تواصل</button>
                    <button onclick="switchTab('vcard')" id="tab-vcard" class="tab-btn flex-1 py-2 px-3 rounded-lg text-[10px] font-bold transition">vCard</button>
                    <button onclick="switchTab('wifi')" id="tab-wifi" class="tab-btn flex-1 py-2 px-3 rounded-lg text-[10px] font-bold transition">WiFi</button>
                    <button onclick="switchTab('bio')" id="tab-bio" class="tab-btn flex-1 py-2 px-3 rounded-lg text-[10px] font-bold transition text-yellow-500">Identity</button>
                </div>
                <div id="dynamic-fields" class="space-y-3"></div>
            </div>

            <div class="glass p-5 rounded-[2rem] space-y-3">
                <span class="text-[10px] font-bold text-gray-500 uppercase">التخصيص والشكل</span>
                <div class="grid grid-cols-2 gap-2">
                    <div class="space-y-1">
                        <label class="text-[9px] text-gray-500">لون النقاط</label>
                        <input type="color" id="qr-fill" value="#3b82f6" class="w-full h-8 bg-transparent cursor-pointer">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] text-gray-500">الخلفية</label>
                        <input type="color" id="qr-bg" value="#ffffff" class="w-full h-8 bg-transparent cursor-pointer">
                    </div>
                </div>
                <select id="dot-style" class="input-field text-xs">
                    <option value="extra-rounded">نقاط انسيابية</option>
                    <option value="dots">نقاط دائرية</option>
                    <option value="square">مربعات</option>
                </select>
                <label class="text-[9px] text-blue-400 font-bold block">لوجو وسط الباركود:</label>
                <input type="file" id="qr-logo" accept="image/*" class="input-field text-[10px]">
                <button onclick="generateFinalMadoQR()" class="w-full bg-blue-600 p-4 rounded-xl font-black hover:bg-blue-500 transition-all shadow-lg">توليد الباركود الذكي ✨</button>
            </div>
        </div>

        <div class="lg:col-span-4">
            <div class="iphone-frame" id="live-bg">
                <div class="iphone-notch"></div>
                <div id="preview-content" class="p-6 pt-12 flex flex-col h-full overflow-y-auto"></div>
            </div>
        </div>

        <div class="lg:col-span-4 flex flex-col items-center">
            <div id="qr-target" class="bg-white p-6 rounded-[2.5rem] hidden shadow-2xl"></div>
            <div id="qr-placeholder" class="glass border-2 border-dashed border-gray-800 p-20 rounded-[2.5rem] text-sm text-center text-gray-500">الباركود سيظهر هنا</div>
            <div id="dl-group" class="hidden flex gap-2 mt-6 w-full max-w-[240px]">
                <button onclick="downloadQR('png')" class="flex-1 bg-white text-black py-3 rounded-xl font-bold text-xs">PNG</button>
                <button onclick="downloadQR('svg')" class="flex-1 bg-blue-500 text-white py-3 rounded-xl font-bold text-xs">SVG</button>
            </div>
        </div>
    </div>
</div>

<script>
    let qrCode;
    let currentTab = 'url';
    const presets = {
        googlemaps: { color: '#4285F4', logo: 'https://cdn.simpleicons.org/googlemaps/4285F4' }
    };

    const fields = {
        url: `<input type="text" id="m-url" oninput="live()" placeholder="https://example.com" class="input-field">`,
        google_review: `
            <div class="space-y-3">
                <label class="text-[10px] text-blue-400 font-bold italic text-center block">الصق رابط جوجل ماب هنا (مشاركة):</label>
                <input type="text" id="g-map-url" oninput="live()" placeholder="https://maps.app.goo.gl/..." class="input-field">
                <p class="text-[9px] text-gray-500 leading-relaxed">سيقوم MaDo QR بتحويله لرابط "التقييم الفوري" الذي يفتح النجوم مباشرة.</p>
            </div>`,
        social: `<input type="text" id="s-input" oninput="live()" placeholder="رابط الحساب" class="input-field">`,
        wifi: `<input type="text" id="w-ssid" oninput="live()" placeholder="اسم الشبكة" class="input-field">`,
        vcard: `<input type="text" id="vc-fn" oninput="live()" placeholder="الاسم الكامل" class="input-field">`,
        bio: `<input type="text" id="b-n" oninput="live()" placeholder="الاسم" class="input-field">`
    };

    function switchTab(t) {
        currentTab = t;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('tab-'+t).classList.add('active-tab');
        document.getElementById('dynamic-fields').innerHTML = fields[t];
        live();
    }

    function live() {
        const content = document.getElementById('preview-content');
        content.innerHTML = "";
        if(currentTab === 'google_review') {
            content.innerHTML = `<div class="m-auto text-center">
                <div class="w-16 h-16 mx-auto bg-white p-3 rounded-2xl shadow-xl mb-4"><img src="${presets.googlemaps.logo}"></div>
                <div class="text-blue-400 font-bold text-sm">تقييم مباشر فوري</div>
                <div class="text-[8px] opacity-30 mt-3 px-6 break-all">${document.getElementById('g-map-url').value || 'أدخل الرابط...'}</div>
            </div>`;
        } else {
            content.innerHTML = `<div class="m-auto opacity-20 text-[10px]">MaDo QR Live Preview</div>`;
        }
    }

    async function generateFinalMadoQR() {
        let txt = "";
        let finalLogo = "";

        if(currentTab === 'google_review') {
            const raw = document.getElementById('g-map-url').value;
            // استخراج الـ Place ID ذكياً لضمان فتح صفحة النجوم مباشرة
            const match = raw.match(/ChIJ[a-zA-Z0-9_-]+/);
            if(match) {
                // هذا هو الرابط الذي يجبر التطبيق على فتح صفحة التقييم فوراً
                txt = `https://search.google.com/local/writereview?placeid=${match[0]}`;
            } else {
                txt = raw; 
            }
            finalLogo = presets.googlemaps.logo;
            document.getElementById('qr-fill').value = "#4285F4";
        } else {
            txt = document.getElementById('m-url')?.value || "MaDo QR";
        }

        const target = document.getElementById('qr-target');
        target.innerHTML = ""; target.classList.remove('hidden');
        document.getElementById('qr-placeholder').classList.add('hidden');
        document.getElementById('dl-group').classList.remove('hidden');

        qrCode = new QRCodeStyling({
            width: 280, height: 280, data: txt,
            qrOptions: { errorCorrectionLevel: 'H' },
            image: finalLogo,
            dotsOptions: { color: document.getElementById('qr-fill').value, type: document.getElementById('dot-style').value },
            backgroundOptions: { color: document.getElementById('qr-bg').value },
            imageOptions: { imageSize: 0.4, margin: 5, hideBackgroundDots: true }
        });
        qrCode.append(target);
    }

    function downloadQR(ext) { qrCode.download({ name: "MaDo_Review_QR", extension: ext }); }

    window.onload = () => switchTab('url');
</script>
</body>
</html>
